<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安静书项目管理 - Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- 头部导航 -->
    <header class="dashboard-header">
        <div class="header-content">
            <div class="dashboard-title">
                <a href="index.html" style="color: #6c757d; text-decoration: none; margin-right: 15px; font-size: 14px;">
                    ← 返回编辑器
                </a>
                <i class="fas fa-book-open"></i>
                安静书项目管理
            </div>
            <div class="header-actions">
                <button id="createProjectBtn" class="btn btn-primary">
                    <i class="fas fa-plus"></i>
                    创建新项目
                </button>
                <button id="importProjectBtn" class="btn btn-secondary">
                    <i class="fas fa-upload"></i>
                    导入项目
                </button>
            </div>
        </div>
    </header>

        <!-- 主要内容区域 -->
        <main class="dashboard-main">
            <!-- 统计卡片 -->
            <section class="stats-section">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-header">
                            <div class="stat-title">总项目数</div>
                            <div class="stat-icon projects">
                                <i class="fas fa-folder"></i>
                            </div>
                        </div>
                        <div class="stat-value" id="totalProjects">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-header">
                            <div class="stat-title">总页面数</div>
                            <div class="stat-icon pages">
                                <i class="fas fa-file-alt"></i>
                            </div>
                        </div>
                        <div class="stat-value" id="totalPages">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-header">
                            <div class="stat-title">最近项目</div>
                            <div class="stat-icon recent">
                                <i class="fas fa-clock"></i>
                            </div>
                        </div>
                        <div class="stat-value" id="recentProjects">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-header">
                            <div class="stat-title">已导出项目</div>
                            <div class="stat-icon exported">
                                <i class="fas fa-download"></i>
                            </div>
                        </div>
                        <div class="stat-value" id="exportedProjects">0</div>
                    </div>
                </div>
            </section>

            <!-- 项目列表 -->
            <section class="projects-section">
                <div class="projects-header">
                    <div class="projects-title">我的项目</div>
                    <div class="projects-controls">
                        <div class="search-box">
                            <i class="fas fa-search search-icon"></i>
                            <input type="text" id="searchInput" class="search-input" placeholder="搜索项目...">
                        </div>
                        <div class="controls-right">
                            <select id="sortSelect" class="sort-select">
                                <option value="modified">最近修改</option>
                                <option value="created">创建时间</option>
                                <option value="name">项目名称</option>
                                <option value="pages">页面数量</option>
                            </select>
                            <div class="view-controls">
                                <button id="gridViewBtn" class="view-btn active" title="网格视图">
                                    <i class="fas fa-th"></i>
                                </button>
                                <button id="listViewBtn" class="view-btn" title="列表视图">
                                    <i class="fas fa-list"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="projects-content">
                    <!-- 项目网格/列表容器 -->
                    <div id="projectsContainer" class="projects-grid">
                        <!-- 项目卡片将通过JavaScript动态生成 -->
                    </div>

                    <!-- 空状态 -->
                    <div id="emptyState" class="empty-state" style="display: none;">
                        <i class="fas fa-folder-open"></i>
                        <h3>还没有项目</h3>
                        <p>创建您的第一个安静书项目开始吧！</p>
                        <button class="btn btn-primary" onclick="createNewProject()">
                            <i class="fas fa-plus"></i>
                            创建新项目
                        </button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- 创建项目模态框 -->
    <div id="createProjectModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>创建新项目</h3>
                <button class="modal-close" onclick="closeModal('createProjectModal')">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="createProjectForm">
                    <div class="form-group">
                        <label for="projectName">项目名称</label>
                        <input type="text" id="projectName" name="projectName" required placeholder="输入项目名称">
                    </div>
                    <div class="form-group">
                        <label for="projectDescription">项目描述</label>
                        <textarea id="projectDescription" name="projectDescription" placeholder="输入项目描述（可选）"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="projectTemplate">初始模板</label>
                        <select id="projectTemplate" name="projectTemplate">
                            <option value="basic-room">基础房间模板</option>
                            <option value="dual-room">双房间模板</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="projectPaperSize">纸张尺寸</label>
                        <select id="projectPaperSize" name="projectPaperSize">
                            <option value="a4">A4</option>
                            <option value="a3">A3</option>
                            <option value="letter">Letter</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="projectOrientation">页面方向</label>
                        <select id="projectOrientation" name="projectOrientation">
                            <option value="portrait">竖向</option>
                            <option value="landscape">横向</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal('createProjectModal')">取消</button>
                <button type="submit" form="createProjectForm" class="btn btn-primary">创建项目</button>
            </div>
        </div>
    </div>

    <!-- 项目详情模态框 -->
    <div id="projectDetailsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="projectDetailsTitle">项目详情</h3>
                <button class="modal-close" onclick="closeModal('projectDetailsModal')">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div id="projectDetailsContent">
                    <!-- 项目详情内容将通过JavaScript动态生成 -->
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal('projectDetailsModal')">关闭</button>
                <button type="button" id="editProjectBtn" class="btn btn-primary">编辑项目</button>
                <button type="button" id="deleteProjectBtn" class="btn btn-danger">删除项目</button>
            </div>
        </div>
    </div>

    <!-- 通知组件 -->
    <div id="notification" class="notification">
        <div class="notification-content">
            <i class="notification-icon"></i>
            <span class="notification-message"></span>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
